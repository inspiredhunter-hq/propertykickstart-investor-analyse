name: Deploy PK Investor Survey V2 PRODUCTION Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pk-investor-survey-production-worker
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/release/survey-v2-20261109-candidate'
    runs-on: ubuntu-latest
    environment: survey-production
    steps:
      - name: Check out governed release candidate
        uses: actions/checkout@v4
        with:
          ref: release/survey-v2-20261109-candidate
          persist-credentials: false
      - name: Verify production target and code
        run: |
          grep -Fx 'name = "pk-investor-survey"' cloudflare/wrangler.survey-production.toml
          grep -Fx 'main = "investor-survey-worker-v2-production.mjs"' cloudflare/wrangler.survey-production.toml
          grep -Fx 'ALLOWED_ORIGIN = "https://survey.propertykickstart.co.uk"' cloudflare/wrangler.survey-production.toml
          grep -F '"Test response":{checkbox:false}' cloudflare/investor-survey-worker-v2-production.mjs
          grep -F 'https://pk-investor-survey.propertykickstartuk.workers.dev' production/2027/index.html
      - name: Deploy production survey Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy --config wrangler.survey-production.toml
