name: ACT-882 production analyser acceptance
on:
  pull_request:
    paths:
      - 'index.html'
      - 'question-controls.js'
      - 'question-controls.css'
      - 'HA-*/**'
      - 'BTL-*/**'
      - 'HMO-*/**'
      - 'scripts/check-production-browser.mjs'
      - 'scripts/check-btl-default-rates.mjs'
      - 'scripts/test-btl-default-rates.mjs'
      - 'scripts/check-hmo-mobile-finance.mjs'
      - '.github/workflows/act-882-production-acceptance.yml'
      - 'scripts/check-live-custom-domain.mjs'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-analysers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          command -v pdfinfo >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
      - name: Enforce PK BTL base-rate defaults across all published BTL pages
        run: |
          node scripts/check-btl-default-rates.mjs
          node scripts/test-btl-default-rates.mjs
      - name: Check property finances, mobile, help controls and printable PDF
        run: node scripts/check-production-browser.mjs
      - name: Check HMO fee rules and mobile review regressions
        run: node scripts/check-hmo-mobile-finance.mjs
      - name: Verify actual public domain routes
        run: node scripts/check-live-custom-domain.mjs
      - name: Verify deployed HMO interactions and calculations
        if: github.event_name == 'push'
        env:
          PK_HMO_TEST_URL: https://deals.propertykickstart.co.uk/HMO-NW-2S98D/
        run: |
          for attempt in $(seq 1 12); do
            if node scripts/check-hmo-mobile-finance.mjs; then exit 0; fi
            echo "Waiting for GitHub Pages to serve the current release (attempt $attempt)"
            sleep 15
          done
          exit 1
      - name: Keep evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-analyser-mobile-qa
          path: qa-evidence/
          retention-days: 30
