name: Generate approved HMO analyser drafts from validated inputs
on:
  workflow_dispatch:
    inputs:
      property_json:
        description: 'Validated Step 5 property JSON; no personal data'
        required: false
        type: string
  repository_dispatch:
    types: [pk_hmo_analyser_step5]
  pull_request:
    paths:
      - '.github/workflows/generate-hmo-draft.yml'
      - 'scripts/new_hmo_analyser.py'
      - 'tests/test_hmo_generator.py'
      - 'hmo-inputs/*.json'
  push:
    paths:
      - 'hmo-inputs/*.json'
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate generator test suite
        run: python -m unittest discover -s tests -p 'test_hmo_generator.py' -v
      - name: Validate authenticated dispatch input
        env:
          INPUT_JSON: ${{ inputs.property_json }}
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          event=os.environ.get('GITHUB_EVENT_NAME')
          raw=os.environ.get('INPUT_JSON','') if event=='workflow_dispatch' else ''
          if event=='repository_dispatch':
              p=json.loads(os.environ['PAYLOAD_JSON'])
              raw=p.get('property_json','')
              if not isinstance(raw,str): raise SystemExit('Invalid dispatch payload')
          if raw:
              d=json.loads(raw)
              code=d.get('property_code','')
              import re
              if not isinstance(code,str) or not re.fullmatch(r'HMO-[A-Z]{2}-[A-Z0-9]{5,}',code):
                  raise SystemExit('Invalid HMO property code')
              p=pathlib.Path('hmo-inputs')
              p.mkdir(exist_ok=True)
              target=p/(code+'.json')
              if target.exists(): raise SystemExit('Duplicate property input')
              target.write_text(json.dumps(d),encoding='utf-8')
          elif event=='repository_dispatch':
              raise SystemExit('Missing property_json in dispatch')
          PY
      - name: Build HMO drafts from property-specific records
        shell: bash
        run: |
          shopt -s nullglob
          files=(hmo-inputs/*.json)
          if (( ${#files[@]} == 0 )); then
            echo "No HMO inputs to generate"; exit 0
          fi
          for file in "${files[@]}"; do
            python scripts/new_hmo_analyser.py "$file"
          done
      - name: Collect draft analyser HTML
        shell: bash
        run: |
          mkdir -p output
          shopt -s nullglob
          for file in hmo-inputs/*.json; do
            code=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["property_code"])' "$file")
            mkdir -p "output/$code"
            cp "$code/index.html" "output/$code/index.html"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hmo-draft-analysers
          path: output/
          if-no-files-found: ignore
          retention-days: 14
