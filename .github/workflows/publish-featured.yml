name: Publish featured SMART Deal
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Hourly coverage spans 08:00–21:00 UK in winter and summer.
    - cron: '0 7-21 * * 4,5'
    # Delayed publication catch-up at weekends.
    - cron: '0 8,11,14,17,20 * * 6,0'
permissions:
  contents: write
concurrency:
  group: pk-featured-deal
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publication and prepare featured page
        env:
          NOTION_TOKEN: ${{ secrets.PK_NOTION_READ_TOKEN }}
          NOTION_DATABASE_ID: d915e3ac-8612-4454-ad05-a55f5534277a
        run: node scripts/promote-featured.mjs
      - name: Commit approved change when required
        run: |
          if git diff --quiet -- index.html config/featured-deal.json; then
            echo "No release changes."
            exit 0
          fi
          git config user.name "Property Kickstart Publishing Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html config/featured-deal.json
          git commit -m "Publish latest verified SMART Deal of the Week"
          git push
