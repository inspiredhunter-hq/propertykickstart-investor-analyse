name: St Helens agreed updates acceptance
on:
  push:
    branches: [review/st-helens-coventry-parity-20261103]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - run: |
          for attempt in $(seq 1 15); do
            if node scripts/check-sthelens-followup.mjs; then exit 0; fi
            sleep 15
          done
          exit 1
        env:
          PK_TEST_ORIGIN: https://deals.propertykickstart.co.uk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sthelens-followup-qa
          path: qa-evidence/hmo-parity/
