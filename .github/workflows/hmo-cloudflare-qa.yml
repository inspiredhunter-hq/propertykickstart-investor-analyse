name: HMO Cloudflare handoff checks
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'tests/hmo-cloudflare-worker.test.mjs'
      - '.github/workflows/hmo-cloudflare-qa.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'tests/hmo-cloudflare-worker.test.mjs'
      - '.github/workflows/hmo-cloudflare-qa.yml'
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check cloudflare/hmo-step5-worker.mjs
      - run: node --test tests/hmo-cloudflare-worker.test.mjs
