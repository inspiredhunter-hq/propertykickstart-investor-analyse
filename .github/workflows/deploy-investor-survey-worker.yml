name: Deploy PK Investor Survey Worker
on:
  workflow_dispatch:
    inputs:
      qa_only:
        description: Run checks only without deploying the Worker
        type: boolean
        default: true
      diagnose_lookup:
        description: Run controlled synthetic investor lookup diagnostic after TEST backend deployment
        type: boolean
        default: false
      verify_brevo_sync:
        description: ACT-832 read-only verification of the prepared Brevo contact sync (no deploy, no writes)
        type: boolean
        default: false
      inspect_assessment:
        description: Read current Assessment Worker source only; no deployment or customer actions
        type: boolean
        default: false
      apply_assessment:
        description: Apply verified Assessment identity-link correction only; public survey launch excluded
        type: boolean
        default: false
      read_assessment_logs:
        description: Read redacted Assessment lookup error codes only; no deployment
        type: boolean
        default: false
      diagnose_assessment_once:
        description: Recover known synthetic Assessment through existing automatic matcher; no notifications
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ !inputs.verify_brevo_sync && !inputs.inspect_assessment && !inputs.apply_assessment && !inputs.read_assessment_logs && !inputs.diagnose_assessment_once }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run survey regression suites
        run: |
          node tests/investor-survey-regression.mjs
          node tests/investor-survey-production.mjs
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/pk-survey-qa --no-save playwright@1.62.1
          /tmp/pk-survey-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify responsive production candidate
        env:
          NODE_PATH: /tmp/pk-survey-qa/node_modules
        run: node tests/investor-survey-browser.cjs
      - name: Verify BUG-47 professionals follow-up scenarios
        env:
          NODE_PATH: /tmp/pk-survey-qa/node_modules
        run: node tests/investor-survey-bug47-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-responsive-evidence
          path: survey-qa/
      - name: Check deployment credentials
        if: ${{ !inputs.qa_only }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Deploy isolated survey Worker
        if: ${{ !inputs.qa_only }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.45.0'
          command: deploy --config cloudflare/investor-survey.wrangler.toml

      - name: Diagnose investor lookup without exposing personal data
        if: ${{ inputs.diagnose_lookup && !inputs.qa_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tests/survey-lookup-diagnostic.cjs

  inspect-assessment:
    if: ${{ inputs.inspect_assessment || inputs.apply_assessment }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read Assessment source through existing Cloudflare connection
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os, urllib.request, urllib.error, email, email.policy, json, re, hashlib, pathlib
          token = os.environ.get("CF_TOKEN", "")
          account = os.environ.get("CF_ACCOUNT", "")
          if not token or not account:
              raise SystemExit("Existing Cloudflare connection is missing.")
          endpoint = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/pk-automation-staging/content/v2"
          req = urllib.request.Request(endpoint, headers={"Authorization": "Bearer " + token}, method="GET")
          try:
              with urllib.request.urlopen(req, timeout=40) as response:
                  raw = response.read(3000001)
                  content_type = response.headers.get("Content-Type", "")
                  status = response.status
          except urllib.error.HTTPError as exc:
              print("Assessment source read HTTP", exc.code)
              print("No source downloaded. Existing credential permission is insufficient or expired; no permission change attempted.")
              raise SystemExit(1)
          if len(raw) > 3000000:
              raise SystemExit("Source exceeds bounded read size.")
          message = email.message_from_bytes(("Content-Type: " + content_type + "\r\nMIME-Version: 1.0\r\n\r\n").encode() + raw, policy=email.policy.default)
          if not message.is_multipart():
              raise SystemExit("Unexpected source response; body not logged.")
          modules = {}
          for part in message.iter_parts():
              name = part.get_filename() or part.get_param("name", header="content-disposition")
              if name and re.fullmatch(r"[A-Za-z0-9_.-]+\.mjs", name):
                  modules[name] = part.get_payload(decode=True).decode("utf-8")
          target = pathlib.Path("/tmp/act900-current-act48")
          target.mkdir(mode=0o700)
          for name, code in modules.items():
              if token in code or re.search(r"xkeysib-[A-Za-z0-9-]+|-----BEGIN .*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]+", code):
                  raise SystemExit("Potential embedded credential; source not exported.")
              (target/name).write_text(code)
          print("READ ONLY. No deployment, settings change, database write or message send.")
          print("Complete source hashes:", json.dumps({name:hashlib.sha256(code.encode()).hexdigest() for name,code in modules.items()}))
          for resource in ["settings", "deployments"]:
              url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/pk-automation-staging/" + resource
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token}, method="GET")
              with urllib.request.urlopen(request, timeout=30) as response:
                  result=json.load(response).get("result", {})
              if resource=="settings":
                  bindings=result.get("bindings", [])
                  print("Current binding names/types:", json.dumps([{"name":x.get("name"),"type":x.get("type")} for x in bindings]))
                  names={"QUIZ_INTAKE_ENABLED","QUIZ_CONSUMER_ENABLED","BOOKING_SYNC_ENABLED","HMO_ENABLED","ASSESSMENT_INVESTOR_LINK_ENABLED"}
                  print("Current operational flags:", json.dumps({x["name"]:x.get("text") for x in bindings if x.get("name") in names and x.get("type")=="plain_text"}))
                  print("Current compatibility:", json.dumps({k:result.get(k) for k in ["compatibility_date","compatibility_flags"]}))
              else:
                  print("Current deployment identity:", json.dumps(result))

          print("Modules:", json.dumps(sorted(modules)))
          selected = ["quiz-contract.mjs", "quiz-http-intake.mjs", "quiz-store.mjs", "quiz-consumer.mjs", "quiz-pipeline.mjs", "quiz-live-runtime.mjs", "notion-client.mjs", "lead-mapping.mjs", "delivery-engine.mjs"]
          for name in selected:
              code = modules.get(name)
              if code is None:
                  print("Module absent:", name)
                  continue
              print("MODULE", name, "SHA256", hashlib.sha256(code.encode()).hexdigest())
              # Never disclose the credential, or any recognisable embedded credential.
              if token in code or re.search(r"xkeysib-[A-Za-z0-9-]+|-----BEGIN .*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]+", code):
                  print("Source withheld: potential embedded credential; no content logged.")
                  continue
              # Mask hard-coded string assignments to credential-like names.
              code = re.sub(r"(?i)((?:[A-Za-z0-9_]*(?:token|secret|password|api_key)[A-Za-z0-9_]*)\s*[:=]\s*)([\"'])([^\r\n]*?)\2", r"\1\2[REDACTED]\2", code)
              print(code[:35000])

      - name: Test candidate against fresh deployed pipeline without provider writes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --test tests/assessment-investor-link.mjs
          python scripts/prepare-assessment-link-patch.py /tmp/act900-current-act48
          python scripts/deploy-assessment-link.py /tmp/act900-current-act48
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {processQuizSubmission} from '/tmp/act900-current-act48/quiz-pipeline.mjs';
          import {withInvestorProfileLink} from '/tmp/act900-current-act48/assessment-investor-link.mjs';
          let sends=0; const claimed=new Set();
          let writes=0, queries=0, row={state:'pending',receivedAt:'2026-11-07T06:00:00Z',prepared:null}, completed;
          // Load existing mapping schema and exercise the actual deployed pipeline with a validated fixture.
          const {leadSchema}=await import('/tmp/act900-current-act48/qa-schema.mjs');
          const option=n=>leadSchema[n].options[0].name;
          const evidence={experience:option('Experience'),primaryGoal:option('Primary Goal'),timeline:option('Timeline'),budget:option('Budget'),financeMethod:option('Finance Method'),financeInPlace:option('Finance in Place'),propertyOwnership:option('Property Ownership'),handsOnPreference:option('Hands-On Preference'),mobile:''};
          row.prepared={contractVersion:'fixture-only',contact:{email:'qa@example.invalid',fullName:'Synthetic QA',firstName:'Synthetic'},evidence,derived:{legacyInvestorType:option('Investor Type'),readinessScore:15,cashBuyer:false,financeReady:false,handsOffFlag:true,sub50k:false},answers:{outcome:'Fixture',priorities:'Fixture',preferred_investment_areas:[],blockers:[]}};
          const base={findContactIds:async()=>[],writeLead:async plan=>{writes++;assert.equal(plan.properties['Investor Profile'].relation[0].id,'4102aad7-d30e-81a9-81fb-c3d07d618628');assert.equal(plan.properties['Readiness Score'].number,15);return {pageId:'4102aad7-d30e-8170-95df-df6993b6fe17'};}};
          const notion=withInvestorProfileLink({notion:base,token:'fixture-only',investorDataSourceId:'0c8ed56c-8c78-40ba-9f44-b8e8c97d0aec',fetchImpl:async()=>{queries++;return new Response(JSON.stringify({results:[{id:'4102aad7-d30e-81a9-81fb-c3d07d618628',properties:{Email:{email:'qa@example.invalid'}}}],has_more:false}));}});
          const store={load:async()=>row,claim:async()=>true,lockContact:async()=>true,hold:async()=>{throw Error('Unexpected hold');},complete:async(id,result)=>{completed=result;row={...row,state:'synced',pageId:result.pageId,notifications:result.notifications};},refreshRun:async()=> 'complete'};
          const args={submissionId:'fixture-only',store,notion,schema:leadSchema,notificationPlan:async()=>[{key:'fixture-summary',purpose:'summary',destinationRef:'fixture'},{key:'fixture-team',purpose:'team',destinationRef:'fixture'}],send:async()=>{sends++;return {accepted:true,messageId:'fixture-message-'+sends};},ledger:{claim:async key=>{if(claimed.has(key))return false;claimed.add(key);return true;},finish:async()=>{}}};
          assert.equal((await processQuizSubmission(args)).state,'synced');
          assert.equal((await processQuizSubmission(args)).state,'synced');
          assert.equal(writes,1);assert.equal(queries,1);assert.equal(completed.notifications.length,2);assert.equal(sends,2);
          console.log('PASS actual deployed pipeline + link decorator; retry does not repeat lead write or either notification; provider writes/sends mocked.');
          JS

      - name: Apply narrow Assessment correction and verify readback
        if: ${{ inputs.apply_assessment }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/deploy-assessment-link.py /tmp/act900-current-act48 --apply

  read-assessment-logs:
    if: ${{ inputs.read_assessment_logs }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read stable lookup errors without personal data
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,datetime,re
          base="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]
          headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"],"Content-Type":"application/json"}
          def call(path,body=None):
              req=urllib.request.Request(base+path,headers=headers,data=None if body is None else json.dumps(body).encode(),method="GET" if body is None else "POST")
              try:
                  with urllib.request.urlopen(req,timeout=40) as response: return json.load(response)
              except urllib.error.HTTPError as e:
                  print("Read-only diagnostic HTTP",e.code); return {}
          settings=call("/workers/scripts/pk-automation-staging/settings").get("result",{})
          print("Existing observability configuration:",json.dumps(settings.get("observability",{})))
          stamp=lambda s:int(datetime.datetime.fromisoformat(s).timestamp()*1000)
          result=call("/workers/observability/telemetry/query",{"queryId":"act900-readonly-lookup","timeframe":{"from":stamp("2026-11-07T10:20:00+00:00"),"to":stamp("2026-11-07T10:26:00+00:00")},"parameters":{},"view":"events","limit":1000,"dry":True})
          safe=sorted(set(re.findall(r"notion_investor_[a-z_0-9]+",json.dumps(result))))
          print("Stable redacted lookup codes:",json.dumps(safe))
          print("Query acknowledged:",result.get("success"))
          print("No deployment, settings change, database write or message send.")

  cleanup-assessment-diagnostic:
    if: ${{ inputs.diagnose_assessment_once }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify diagnostic syntax
        run: node --check cloudflare/act900-diagnostic.mjs
      - name: Source-only synthetic diagnostic with preserved configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/diagnose-assessment-once.py /tmp/unused --apply

  verify-brevo-sync:
    if: ${{ inputs.verify_brevo_sync }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download live source, prepare candidate, verify (READ ONLY; no deploy, provider write or message)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/live
          python - <<'PY'
          import os, urllib.request, email, email.policy, pathlib
          req=urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]+"/workers/scripts/pk-automation-staging/content/v2",headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]})
          with urllib.request.urlopen(req,timeout=40) as r: raw=r.read(3000001); ct=r.headers.get("Content-Type","")
          m=email.message_from_bytes(("Content-Type: "+ct+"\r\nMIME-Version: 1.0\r\n\r\n").encode()+raw,policy=email.policy.default)
          n=0
          for part in m.iter_parts():
              name=part.get_filename() or part.get_param("name",header="content-disposition")
              if name and pathlib.PurePosixPath(name).name==name and name.endswith(".mjs"):
                  pathlib.Path("/tmp/live",name).write_bytes(part.get_payload(decode=True)); n+=1
          print("Downloaded modules:",n)
          PY
          node --test tests/assessment-brevo-contact.mjs tests/assessment-investor-link.mjs
          mkdir /tmp/candidate && cp /tmp/live/*.mjs /tmp/candidate/
          python scripts/prepare-assessment-brevo-patch.py /tmp/candidate --expected-runtime-sha256 24bc3bac1a3087e3eae918d8a37d112bee1d40007245f226d0467029929245f5
          for f in /tmp/candidate/*.mjs; do node --check "$f"; done
          python scripts/deploy-assessment-brevo.py /tmp/candidate
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {processQuizSubmission} from '/tmp/candidate/quiz-pipeline.mjs';
          import {withBrevoContactSync} from '/tmp/candidate/assessment-brevo-contact.mjs';
          import {leadSchema} from '/tmp/candidate/qa-schema.mjs';
          const option=n=>leadSchema[n].options[0].name;
          const evidence={experience:option('Experience'),primaryGoal:option('Primary Goal'),timeline:option('Timeline'),budget:option('Budget'),financeMethod:option('Finance Method'),financeInPlace:option('Finance in Place'),propertyOwnership:option('Property Ownership'),handsOnPreference:option('Hands-On Preference'),mobile:'',consentGiven:true,consentTextVersion:'quiz-v1.5-2026-10-07'};
          let row={state:'pending',receivedAt:'2026-11-09T12:00:00Z',prepared:{contractVersion:'fixture-only',contact:{email:'qa@example.invalid',fullName:'Synthetic QA',firstName:'Synthetic'},evidence,derived:{legacyInvestorType:option('Investor Type'),readinessScore:15,cashBuyer:false,financeReady:false,handsOffFlag:true,sub50k:false},answers:{outcome:'Fixture',priorities:'Fixture',preferred_investment_areas:[],blockers:[]}}};
          let writes=0, brevo=[], sends=0, claimed=new Set();
          const base={findContactIds:async()=>[],writeLead:async()=>{writes++;return {pageId:'4102aad7-d30e-8170-95df-df6993b6fe17'};}};
          const notion=withBrevoContactSync({notion:base,apiKey:'fixture-only',listId:34,fetchImpl:async(u,o)=>{brevo.push(JSON.parse(o.body));return new Response(null,{status:201});}});
          const store={load:async()=>row,claim:async()=>true,lockContact:async()=>true,hold:async()=>{throw Error('hold');},complete:async(id,r)=>{row={...row,state:'synced',pageId:r.pageId,notifications:r.notifications};},refreshRun:async()=>'complete'};
          const args={submissionId:'fixture-only',store,notion,schema:leadSchema,notificationPlan:async()=>[{key:'k1',purpose:'summary',destinationRef:'fixture'}],send:async()=>{sends++;return {accepted:true,messageId:'m'+sends};},ledger:{claim:async k=>{if(claimed.has(k))return false;claimed.add(k);return true;},finish:async()=>{}}};
          assert.equal((await processQuizSubmission(args)).state,'synced');
          assert.equal((await processQuizSubmission(args)).state,'synced');
          assert.equal(writes,1); assert.equal(brevo.length,1); assert.deepEqual(brevo[0].listIds,[34]); assert.equal(brevo[0].attributes.ASSESSMENT_RESPONSE_ID,'4102aad7-d30e-8170-95df-df6993b6fe17'); assert.equal(sends,1);
          console.log('PASS actual live pipeline + Brevo sync: one lead write, one contact upsert with list 34, retry repeats neither; all provider calls mocked.');
          JS
