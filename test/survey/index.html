<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 Investor Survey | Property Kickstart TEST</title><style>:root{--purple:#300438;--orange:#bd5d20;--bg:#faf8f5;--ink:#29242b;--muted:#706973;--line:#e7e0e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}header,footer{max-width:900px;margin:auto;padding:24px 22px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:750;color:var(--purple);font-size:clamp(18px,4vw,25px)}.mark{display:inline-grid;place-items:center;border:1px solid #ddcadc;border-radius:13px;width:42px;height:42px;margin-right:9px;font-family:Georgia,serif;font-size:27px}.test{font-size:11px;letter-spacing:.1em;border:1px solid #caa7b8;color:var(--purple);border-radius:40px;padding:5px 9px}main{max-width:760px;margin:0 auto;min-height:70vh;padding:30px 24px 45px}h1{font:normal clamp(33px,6vw,52px)/1.16 Georgia,serif;letter-spacing:-.025em;color:var(--purple);margin:16px 0 20px}.intro{font-size:18px;color:#5f5860;max-width:620px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:#8a4c70}.progress{height:3px;background:#e7e0e5;border-radius:4px;overflow:hidden;margin:10px 0 22px}.fill{height:100%;background:var(--orange);transition:width .2s}.choices{display:grid;gap:11px;margin:18px 0}.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid #e5dce3;background:#fff;border-radius:13px;padding:17px 18px;color:var(--ink);font:inherit;cursor:pointer;min-height:62px}.choice.selected{border-color:var(--purple);background:#f5eef5;box-shadow:inset 0 0 0 1px var(--purple)}.symbol{flex:none;display:grid;place-items:center;width:29px;height:29px;border:1px solid #d7cbd4;border-radius:8px;font-size:13px;color:var(--purple)}.selected .symbol{background:var(--purple);color:white;border-color:var(--purple)}.rank{margin-left:auto;color:var(--purple);font-size:12px;font-weight:700}.actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px}.primary,.back{font:inherit;border-radius:11px;padding:13px 22px;cursor:pointer}.primary{background:var(--purple);color:white;border:1px solid var(--purple);font-weight:650}.back{background:transparent;border:1px solid var(--line);color:var(--purple)}.primary:focus-visible,.choice:focus-visible,.back:focus-visible{outline:3px solid var(--orange);outline-offset:3px}textarea,input[type=text]{width:100%;font:inherit;border:1px solid #d9cbd5;border-radius:12px;padding:16px;background:white;color:var(--ink)}textarea{min-height:150px}.helper{color:var(--muted);font-size:15px}.error{color:#9c2828;font-size:14px;min-height:24px}.summary{background:#fff;border:1px solid var(--line);padding:22px;border-radius:14px;margin:26px 0;overflow-wrap:anywhere}.summary p{border-bottom:1px solid var(--line);padding-bottom:12px;font-size:14px}footer{border-top:1px solid var(--line);font-size:13px;color:#8c838c}@media(max-width:500px){main{padding-top:22px}h1{font-size:clamp(29px,8vw,39px);line-height:1.2;margin:12px 0 14px}.choices{gap:9px;margin:15px 0}.choice{min-height:54px;padding:12px 14px}.actions{margin-top:16px}header{padding:17px 16px}.mark{width:35px;height:35px;font-size:23px}.choice{padding:14px}.test{font-size:10px}}</style></head><body><header><div class="brand"><span class="mark">P</span>Property Kickstart</div><span class="test">TEST PREVIEW</span></header><main><div id="progressWrap" hidden><div class="eyebrow" id="progressText"></div><div class="progress"><div class="fill" id="fill"></div></div></div><section id="screen"></section></main><footer>© Property Kickstart · Investor perspectives · TEST environment</footer><script>
const Q=[
{t:"Are you currently a landlord?",o:["Yes","No"]},
{t:"",o:[]},
{t:"What are your two most important property investment objectives for 2027?",type:"rank",o:["Increase dependable monthly income","Build long-term wealth","Reduce day-to-day management responsibilities","Diversify my investments","Improve the performance of my existing portfolio","Consolidate or reduce my existing portfolio","Other"]},
{t:"What are your three biggest challenges when considering another property acquisition?",type:"multi",o:["Finding suitable properties","Understanding financial returns","Assessing risks","Finding reliable professionals","Finding sufficient time","Financing acquisitions","Managing properties after purchase","Verifying property information without travelling to view it","Other"]},
{t:"What matters most when deciding whether a property is worth pursuing?",type:"rank",o:["Dependable net income","Long-term capital growth","Minimal management involvement","Purchase price relative to value","Potential to improve property performance","Clear and manageable risks","Other"]},
{t:"What is the main reason you haven't acquired another investment property recently?",o:["I haven't found properties that meet my requirements","The financial returns haven't been attractive enough","I haven't had sufficient time","I don't currently have the capital or financing","I'm concerned about economic or regulatory uncertainty","I haven't been able to verify property information sufficiently","I'm already acquiring properties","I'm not currently planning to acquire another property","Other"]},
{t:"Which part of acquiring an investment property would you most value having handled for you?",type:"rank",exclusive:"Nothing, I prefer handling everything myself",o:["Finding properties that meet my requirements","Assessing financial performance and returns","Verifying property information and conducting due diligence","Coordinating the purchase process","Finding reliable local professionals","Arranging ongoing property management","Nothing, I prefer handling everything myself","Other"]},
{t:"What hasn't worked as well as you'd hoped when trying to acquire an investment property?",type:"text",helper:"Tell us about your experience."},
{t:"What would make acquiring your next investment property significantly easier?",type:"text",helper:"In your own words, tell us what would make the biggest difference."},
{t:"How would you prefer to receive support when acquiring your next investment property?",o:["A fully managed service, with most of the process handled for me.","Personal support with specific parts of the process.","Access to suitable properties, with me managing the acquisition.","Tools and resources to help me manage the process independently.","I wouldn't need additional support.","Other"]},
{t:"Would you be interested in seeing property opportunities that match your investment objectives?",o:["Yes, I'm actively looking","Possibly, for the right opportunity","Not at the moment"]}
];
const yes=["Actively expanding","Looking to expand when the right opportunity arises","Maintaining my existing portfolio","Consolidating or reducing my portfolio","Undecided"];
const no=["Actively looking to acquire my first investment property","Planning to invest when the right opportunity arises","Exploring property investment","Not currently planning to invest"];
const a={},extra={};let step=-1;const el=document.getElementById("screen");
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function qnow(){if(step!==1)return Q[step];return{t:a[0]==="Yes"?"Which best describes your current plans for your property portfolio?":"Which best describes your current property investment plans?",o:a[0]==="Yes"?yes:no}}
function render(){document.getElementById("progressWrap").hidden=step<0||step>10;if(step>=0&&step<=10){document.getElementById("progressText").textContent="Question "+(step+1)+" of 11";document.getElementById("fill").style.width=((step+1)/11*100)+"%"}
if(step===-1){el.innerHTML='<p class="eyebrow">2027 investor survey</p><h1>A thoughtful conversation about your property plans.</h1><p class="intro">What matters most to you as a property investor? We would value your perspective on the priorities and challenges shaping the year ahead.</p><p class="helper">Eleven questions · Approximately three minutes</p><div class="actions"><button class="primary" id="begin">Begin survey →</button></div><p class="helper">TEST preview. No responses are sent to the investor database.</p>';document.getElementById("begin").onclick=()=>{step=0;render()};return}
if(step===11){const interested=a[10]!=="Not at the moment";el.innerHTML='<p class="eyebrow">Thank you</p><h1>Your perspective matters.</h1><p class="intro">Thank you for sharing your priorities.</p>'+(interested?'<div class="summary">In the live survey, the next step will be the existing Investor Assessment.</div>':'')+'<div class="summary"><strong>TEST responses (saved in this browser)</strong><div id="recap"></div></div><div class="actions"><button class="back" id="again">Start again</button><button class="primary" id="download">Download TEST responses</button></div>';document.getElementById("recap").innerHTML=Q.map((q,i)=>'<p><b>Q'+(i+1)+':</b> '+escapeHTML(Array.isArray(a[i])?a[i].join(" → "):a[i]||"(blank)")+(extra[i]?" — "+escapeHTML(extra[i]):"")+"</p>").join("");document.getElementById("again").onclick=()=>{step=-1;Object.keys(a).forEach(k=>delete a[k]);Object.keys(extra).forEach(k=>delete extra[k]);render()};document.getElementById("download").onclick=()=>{const payload={record_type:"TEST",survey:"2027 Investor Survey",created_at:new Date().toISOString(),answers:a,other:extra};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const link=document.createElement("a");link.href=u;link.download="TEST-2027-investor-survey.json";link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{localStorage.setItem("PK_TEST_2027_survey",JSON.stringify({record_type:"TEST",answers:a,other:extra}))}catch(e){}return}
const q=qnow(),type=q.type||"single";el.innerHTML='<h1>'+escapeHTML(q.t)+'</h1><p class="helper">'+(type==="rank"?"Select your first and second priorities. Tap again to remove a selection.":type==="multi"?"Choose up to three.":type==="text"?(q.helper||"Share your thoughts."):"Select one answer.")+'</p><div id="options"></div><div id="err" class="error" role="alert"></div><div class="actions"><button class="back" id="back">← Back</button><button class="primary" id="next">'+(step===10?"Finish survey":"Continue →")+'</button></div>';
if(type==="text"){document.getElementById("options").innerHTML='<textarea aria-label="Your answer" id="free" placeholder="Share your thoughts here…"></textarea>';const t=document.getElementById("free");t.value=a[step]||"";t.oninput=()=>a[step]=t.value}else draw(q,type);
document.getElementById("back").onclick=()=>{step--;render()};document.getElementById("next").onclick=()=>{const v=a[step];let ok=type==="text"||type==="single"&&typeof v==="string"||type==="multi"&&Array.isArray(v)&&v.length>0&&v.length<=3||type==="rank"&&Array.isArray(v)&&(v.length===2||q.exclusive&&v.length===1&&v[0]===q.exclusive);if(ok&&(v==="Other"||Array.isArray(v)&&v.includes("Other")))ok=!!String(extra[step]||"").trim();if(!ok){document.getElementById("err").textContent="Please complete the required selection"+(type==="rank"?" (two priorities, unless you chose Nothing).":"")+". Include details if you selected Other.";return}if(step===0)delete a[1];step++;render();window.scrollTo(0,0)}}
function draw(q,type){const opts=document.getElementById("options");opts.className="choices";const chosen=a[step];opts.innerHTML=q.o.map((v,i)=>{const rank=Array.isArray(chosen)?chosen.indexOf(v):-1,active=Array.isArray(chosen)?rank>=0:chosen===v;return '<button type="button" class="choice '+(active?"selected":"")+'" data-i="'+i+'" aria-pressed="'+active+'"><span class="symbol">'+(active?type==="rank"?rank+1:"✓":String.fromCharCode(65+i))+'</span><span>'+escapeHTML(v)+'</span>'+(active&&type==="rank"?'<span class="rank">'+(rank===0?"1st":"2nd")+'</span>':"")+'</button>'}).join("");if(chosen==="Other"||Array.isArray(chosen)&&chosen.includes("Other")){opts.insertAdjacentHTML("beforeend",'<label for="other">Please tell us more</label><input type="text" id="other" placeholder="Your answer">');const inp=document.getElementById("other");inp.value=extra[step]||"";inp.oninput=()=>extra[step]=inp.value}opts.querySelectorAll("[data-i]").forEach(btn=>btn.onclick=()=>{const v=q.o[+btn.dataset.i];if(type==="single")a[step]=v;else{let arr=Array.isArray(a[step])?[...a[step]]:[];if(q.exclusive&&v===q.exclusive)arr=arr.includes(v)?[]:[v];else{arr=arr.filter(x=>x!==q.exclusive);if(arr.includes(v))arr=arr.filter(x=>x!==v);else if(arr.length<(type==="rank"?2:3))arr.push(v)}a[step]=arr}document.getElementById("err").textContent="";draw(q,type)})}render();
</script></body></html>
